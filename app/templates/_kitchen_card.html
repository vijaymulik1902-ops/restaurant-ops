{#- One kitchen ticket line. No prices here, ever. -#}
<div id="item-{{ i.item_id }}" class="kcard st-{{ i.status }}{% if i.status != 'ready' and i.age_seconds >= WARN_KITCHEN_SEC %} late{% endif %}"
     data-card-url="/kitchen/items/{{ i.item_id }}/card?station={{ station }}"
     {% if i.status != 'ready' %}data-late-in="{{ WARN_KITCHEN_SEC - i.age_seconds }}"{% endif %}>
  {% if i.status in ('pending', 'preparing') %}
  <form hx-post="/kitchen/items/{{ i.item_id }}/{{ 'start' if i.status == 'pending' else 'ready' }}"
        hx-target="#item-{{ i.item_id }}" hx-disabled-elt="find button"
        hx-swap="{{ 'outerHTML swap:220ms' if i.status == 'preparing' else 'outerHTML' }}"
        method="post" action="/kitchen/items/{{ i.item_id }}/{{ 'start' if i.status == 'pending' else 'ready' }}">
    <input type="hidden" name="station" value="{{ station }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="kbtn">
  {% else %}
    <div class="kbtn">
  {% endif %}
      <span class="ktop">
        <span class="ktable">T{{ i.table_number }}</span>
        <span class="timer" data-age="{{ i.age_seconds }}">{{ i.age_minutes }}m</span>
      </span>
      <span class="kname"><strong>{{ i.qty }}×</strong> {{ i.name }}</span>
      {% if i.note %}<span class="knote">{{ i.note }}</span>{% endif %}
      <span class="kaction">
        {%- if i.status == 'pending' %}Tap to start cooking
        {%- elif i.status == 'preparing' %}Cooking · tap when ready
        {%- else %}Ready · waiting for pickup{% endif -%}
      </span>
  {% if i.status in ('pending', 'preparing') %}
    </button>
  </form>
  {% else %}
    </div>
  {% endif %}
</div>
